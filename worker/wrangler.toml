# Gateway de dados oficiais da checagem ao vivo.
# 1) Banco D1 já criado (factcheck-dados, região ENAM)
# 2) npm run db:migrate
# 3) npx wrangler secret put GATEWAY_TOKEN   (e PORTAL_TRANSPARENCIA_API_KEY)
# 4) npm run deploy
name = "factcheck-dados"
account_id = "9168f6acd4582cc306bf7b562bb6f01c"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "factcheck-dados"
database_id = "d2808ac6-6261-430f-a95f-a90e0fcfd200"
migrations_dir = "migrations"

# Sincroniza as séries do Banco Central no D1 a cada hora (minuto 17).
[triggers]
crons = ["17 * * * *"]

[observability]
enabled = true
