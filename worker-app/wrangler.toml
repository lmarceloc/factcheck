# App completo da checagem ao vivo no Cloudflare: site (painel + telão) e API.
# O estado do debate vive num Durable Object (SQLite), que também roda a triagem
# e as checagens com o GPT-6 Luna (OpenAI). As fontes oficiais vêm do Worker factcheck-dados.
#
# Deploy (da raiz do projeto): npm run cf:deploy
# Segredos (uma vez):
#   npx wrangler secret put OPENAI_API_KEY
#   npx wrangler secret put OPERATOR_TOKEN        (senha do painel: abra /?token=...)
#   npx wrangler secret put DATA_GATEWAY_TOKEN    (o mesmo GATEWAY_TOKEN do factcheck-dados)
#   npx wrangler secret put ASSEMBLYAI_API_KEY
name = "factcheck"
account_id = "9168f6acd4582cc306bf7b562bb6f01c"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../dist/web"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/checagem/*"]

[[durable_objects.bindings]]
name = "DEBATE"
class_name = "Debate"

# Audiência: 16 fatias contam quem está com a tela do público aberta.
[[durable_objects.bindings]]
name = "PLATEIA"
class_name = "Plateia"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Debate"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Plateia"]

# Chamada interna ao gateway de dados oficiais (sem passar pela internet pública).
[[services]]
binding = "DADOS"
service = "factcheck-dados"

[vars]
EXTRACTION_MODEL = "gpt-6-luna"
VERIFICATION_MODEL = "gpt-6-luna"
EXTRACTION_EFFORT = "low"
VERIFICATION_EFFORT = "medium"
MAX_CONCURRENT_CHECKS = "4"
MAX_SEARCHES_PER_CHECK = "5"
# Publica direto na tela do público; incertas e exageradas esperam revisão no /painel.
AUTO_PUBLISH = "true"
DEMO_MODE = "false"
ASSEMBLYAI_SPEECH_MODEL = "universal-3-6-pro"
ASSEMBLYAI_PARAMS = "language_code=pt"
# Endereço público do site (worker-site/), usado nos links de compartilhamento.
SITE_URL = "https://checagem.agenciabyte.com"

[observability]
enabled = true
